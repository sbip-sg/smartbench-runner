[project]
name = "smartbench-runner"
version = "0.0.1"
authors = [{name="Ta Quang Trung"}]
description = "A tool to run benchmarks of buggy smart contracts."
dynamic = ["dependencies"]
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/sbip-sg/smartbench-runner"
"Bug Tracker" = "https://github.com/sbip-sg/smartbench-runner/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Setuptools
[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

# Code formatting
[tool.black]
line-length = 80
