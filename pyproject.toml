[project]
name = "smartbench-runner"
version = "0.0.1"
authors = [{ name = "Ta Quang Trung" }]
description = "A tool to run benchmarks of buggy smart contracts."
dynamic = ["dependencies"]
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/sbip-sg/smartbench-runner"
"Bug Tracker" = "https://github.com/sbip-sg/smartbench-runner/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Setuptools
[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

# Code formatting
[tool.black]
line-length = 80

# Code import formating
[tool.isort]
import_heading_firstparty = "Library"
import_heading_future = "Futures"
import_heading_local = "Local"
import_heading_stdlib = "Standard Library"
import_heading_thirdparty = "Third Party"
indent = 4
known_first_party = "myapp"
lines_after_imports = 2
lines_between_types = 1
profile = "black"

# Type hinting by mypy
[tool.pylsp-mypy]
enabled = true
live_mode = true
strict = true

# Linting by pylint
[tool.pylint]
max-line-length=80
disable = [
  "too-many-arguments",
  "too-few-public-methods",
  "too-many-return-statements",
  "fixme"
]
